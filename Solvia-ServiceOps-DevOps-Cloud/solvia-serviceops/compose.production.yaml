# Produção single-node com TLS via Caddy. Requer .env.production e DNS.
# docker compose -f compose.production.yaml --env-file .env.production up -d --build
services:
  app:
    build:
      context: .
      target: runtime
    image: solvia-serviceops:prod
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DEMO_MODE: 'false'
      HOST: 0.0.0.0
      PORT: '3100'
      SOLVIA_DATA_DIR: /app/data
      BASE_URL: https://${PUBLIC_HOST:?Configure PUBLIC_HOST no .env.production}
    expose:
      - '3100'
    volumes:
      - solvia_data:/app/data
      - solvia_backups:/app/backups
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 120
    healthcheck:
      test: ['CMD','node','-e',"fetch('http://127.0.0.1:3100/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  proxy:
    image: caddy:2-alpine
    depends_on:
      app:
        condition: service_healthy
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Configure PUBLIC_HOST no .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?Configure ACME_EMAIL}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  backup-scheduler:
    depends_on:
      app:
        condition: service_healthy
    build:
      context: .
      target: runtime
    image: solvia-serviceops:prod
    command: ['node','scripts/backup-scheduler.mjs']
    environment:
      SOLVIA_DATA_DIR: /app/data
      SOLVIA_BACKUP_DIR: /app/backups
      BACKUP_RETENTION_DAYS: '7'
      BACKUP_INTERVAL_HOURS: '24'
    volumes:
      - solvia_data:/app/data:ro
      - solvia_backups:/app/backups
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

volumes:
  solvia_data:
  solvia_backups:
  caddy_data:
  caddy_config:
