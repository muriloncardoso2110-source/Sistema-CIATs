apiVersion: apps/v1
kind: Deployment
metadata:
  name: solvia
  namespace: solvia
  labels:
    app.kubernetes.io/name: solvia
spec:
  # SQLite em volume RWO: SOMENTE uma réplica, estratégia Recreate.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: solvia
  template:
    metadata:
      labels:
        app.kubernetes.io/name: solvia
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: solvia-serviceops:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3100
          env:
            - name: PORT
              value: '3100'
            - name: HOST
              value: '0.0.0.0'
            - name: SOLVIA_DATA_DIR
              value: /app/data
            - name: NODE_ENV
              value: development
            - name: DEMO_MODE
              value: 'true'
            - name: BASE_URL
              value: http://localhost:3100
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /api/ready
              port: http
            failureThreshold: 20
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 750m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: solvia-data
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
