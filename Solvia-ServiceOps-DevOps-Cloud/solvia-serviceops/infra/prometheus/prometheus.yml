global:
  scrape_interval: 20s
  evaluation_interval: 20s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: solvia
    metrics_path: /internal/metrics
    scrape_interval: 15s
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics.token
    static_configs:
      - targets: ['app:3100']
